name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Every file the service worker precaches exists, and every js/ file is precached
        run: node scripts/check-precache.mjs
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
